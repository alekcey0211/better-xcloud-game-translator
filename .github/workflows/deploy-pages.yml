name: Deploy Game Translator

on:
  push:
    branches:
      - typescript
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir public
          cp dist/better-xcloud.user.js public/
          cp dist/better-xcloud.pretty.user.js public/
          cp dist/better-xcloud.meta.js public/
          cp .github/pages/quest-loader.js public/
          BASE_VERSION="$(awk '$2 == "@version" { print $3; exit }' dist/better-xcloud.meta.js)"
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          for FILE in public/better-xcloud.user.js public/better-xcloud.pretty.user.js public/better-xcloud.meta.js; do
            sed -i "s#^// @version      .*#// @version      ${VERSION}#" "$FILE"
          done
          sed -i "s#SCRIPT_VERSION = \"[^\"]*\"#SCRIPT_VERSION = \"${VERSION}\"#" public/better-xcloud.user.js
          sed -i "s#SCRIPT_VERSION = \"[^\"]*\"#SCRIPT_VERSION = \"${VERSION}\"#" public/better-xcloud.pretty.user.js
          sed "s/\[\[VERSION\]\]/${VERSION}/g" .github/pages/index.html > public/index.html
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
